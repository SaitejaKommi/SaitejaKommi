name: Update Mario Contribution World

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep stats and streak fresh
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Contribution Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Generate Mario Animation
        run: |
          python scripts/generate_mario.py

      - name: Update Cache Buster in README
        run: |
          python -c "import re, time; r = open('README.md', encoding='utf-8').read(); r = re.sub(r'mario-github\.gif(\?v=[^\"]*)?', f'mario-github.gif?v={int(time.time())}', r); open('README.md', 'w', encoding='utf-8').write(r)"

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/generated/ README.md
          if git diff --cached --quiet; then
            echo "No changes detected in generated assets."
          else
            git commit -m "chore(mario): update contribution animation and stats [skip ci]"
            git push
          fi
